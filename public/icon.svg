<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Inner Ring / Subtle Accent -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#6366F1" stroke-width="3" stroke-opacity="0.3" />
  <!-- Arasko Abstract Symbol: A stylized geometric 'A' / Wing of Productivity -->
  <g filter="url(#glow)">
    <!-- Main Left Stem -->
    <path d="M160 380 L230 140 C236 120 276 120 282 140 L352 380 C356 394 340 404 328 394 L256 330 L184 394 C172 404 156 394 160 380 Z" fill="url(#markGrad)" />
    <!-- Dynamic Checkmark / Core Star -->
    <path d="M210 270 L245 305 L315 220" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top Sparkle -->
    <circle cx="256" cy="130" r="14" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
