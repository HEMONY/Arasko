<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0a152d" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.6" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <!-- Inner Ring / Subtle Deep-Blue Accent Border -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.25" />
  
  <!-- Arasko Abstract Symbol: Stylized geometric 'A' / Wing of Focus & Productivity -->
  <g filter="url(#glow)">
    <!-- Main Left/Right Symmetrical Geometric 'A' Body -->
    <path d="M150 384 L232 144 C238 126 274 126 280 144 L362 384 C366 396 352 406 340 396 L256 332 L172 396 C160 406 146 396 150 384 Z" fill="url(#markGrad)" />
    <!-- Dynamic Checkmark / Growth Wave -->
    <path d="M205 272 L245 310 L318 215" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top Sparkle Dot of Excellence -->
    <circle cx="256" cy="132" r="14" fill="url(#starGrad)" />
  </g>
</svg>
