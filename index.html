<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Safeguard against iframe/sandbox environments where window.fetch is getter-only
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return currentFetch;
            },
            set(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // In case Object.defineProperty fails silently or throws
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Arasko - Smart Task & Wellness Management</title>
    <meta name="description" content="Arasko is a smart, simple task and time management app designed to help you organize your day, month, and year professionally and effortlessly. Developed by Team Fallt." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <link rel="mask-icon" href="/icon.svg" color="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arasko" />
    <meta name="application-name" content="Arasko" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#030712" />
  </head>
  <body class="bg-[#030712] text-slate-100 antialiased selection:bg-blue-600 selection:text-white" style="margin: 0; padding: 0; background-color: #030712;">
    <div id="root">
      <!-- Instant Pre-Hydration Midnight-Blue Splash Screen -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, #0a152d 0%, #030712 70%); color: #ffffff; font-family: 'Plus Jakarta Sans', 'Cairo', system-ui, sans-serif;">
        <div style="position: relative; width: 88px; height: 88px; margin-bottom: 20px;">
          <svg viewBox="0 0 100 100" width="88" height="88" style="filter: drop-shadow(0 10px 25px rgba(37,99,235,0.45));">
            <defs>
              <linearGradient id="initMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38BDF8" />
                <stop offset="50%" stop-color="#2563EB" />
                <stop offset="100%" stop-color="#1E3A8A" />
              </linearGradient>
              <linearGradient id="initEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#10B981" />
                <stop offset="50%" stop-color="#34D399" />
                <stop offset="100%" stop-color="#6EE7B7" />
              </linearGradient>
            </defs>
            <rect width="100" height="100" rx="26" fill="#060e22" stroke="rgba(56,189,248,0.3)" stroke-width="2" />
            <!-- Main A Left Leg -->
            <path
              d="M26 80L44 24C45.2 20.5 48.8 20.5 50 24L58 48"
              stroke="url(#initMarkGrad)"
              stroke-width="11"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Upward Ascending Progress Checkmark -->
            <path
              d="M34 56H64L76 22"
              stroke="url(#initEmeraldGrad)"
              stroke-width="11"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <!-- Precision Achievement Dot -->
            <circle
              cx="76"
              cy="22"
              r="5"
              fill="#F59E0B"
            />
          </svg>
        </div>
        <div style="font-size: 26px; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(to right, #ffffff, #93c5fd, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          Arasko
        </div>
        <div style="font-size: 12px; font-weight: 600; color: #94a3b8; margin-top: 6px; letter-spacing: 0.5px;">
          رفيقك اليومي للإنتاجية والتركيز
        </div>
        <div style="margin-top: 24px; width: 44px; height: 3px; border-radius: 99px; background: rgba(56,189,248,0.2); overflow: hidden; position: relative;">
          <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #38bdf8, #2563eb); border-radius: 99px; animation: initPulse 1.2s infinite ease-in-out;"></div>
        </div>
        <style>
          @keyframes initPulse {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for offline PWA capabilities
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => {
              console.log('[Arasko] Service Worker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[Arasko] Service Worker registration note:', err);
            });
        });
      }
    </script>
  </body>
</html>
