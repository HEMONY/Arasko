<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="araskoAppIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#09152f" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="araskoAppIconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="araskoAppIconEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <filter id="araskoAppIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#2563EB" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- High-Density Rounded App Icon Canvas -->
  <rect width="512" height="512" rx="118" fill="url(#araskoAppIconBg)" />
  
  <!-- Subtle 3D Glass Specular Ring -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3" />
  <rect x="24" y="24" width="464" height="232" rx="96" fill="white" fill-opacity="0.04" />

  <!-- Arasko Official Geometric Logo -->
  <g transform="translate(56, 56) scale(4)" filter="url(#araskoAppIconGlow)">
    <!-- Main Stylized Left Leg 'A' -->
    <path
      d="M26 80L44 24C45.2 20.5 48.8 20.5 50 24L58 48"
      stroke="url(#araskoAppIconBlue)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Upward Ascending Progress Checkmark -->
    <path
      d="M34 56H64L76 22"
      stroke="url(#araskoAppIconEmerald)"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Golden Goal / Achievement Dot -->
    <circle
      cx="76"
      cy="22"
      r="5"
      fill="#F59E0B"
    />
  </g>
</svg>
